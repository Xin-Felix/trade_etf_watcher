[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-watcher"
version = "0.1.0"
description = "跨平台 ETF/期权盯盘提醒程序"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "APScheduler>=3.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
    "akshare>=1.14.0",
    "pytdx>=1.72",
    "pytz",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
